<style>
:root{--bg:#1a1a2e;--card:#16213e;--accent:#e67e22;--text:#eaeaea;--muted:#888}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden}

.top-bar{display:flex;align-items:center;gap:.5rem;padding:.5rem;background:var(--card);border-radius:10px;margin-bottom:.5rem;flex-wrap:wrap}

.toc-item{display:flex;align-items:center;gap:.4rem;padding:.35rem .5rem;border-radius:6px;cursor:pointer;font-size:.75rem;text-decoration:none;color:var(--text);background:rgba(255,255,255,.03);transition:background .15s}
.toc-item:hover,.toc-item.active{background:rgba(230,126,34,.15)}
.toc-item .badge{font-size:.6rem;padding:.15rem .4rem;border-radius:4px;min-width:28px;text-align:center;flex-shrink:0}
.badge.scraped{background:rgba(46,204,113,.2);color:#2ecc71}

.toc-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.72rem}
#viewer{display:none;text-align:center}
#viewer.active{display:block}
#viewer img{max-width:100%;height:auto;display:block;margin:0 auto;touch-action:manipulation;-webkit-user-select:none}
#viewer img.zoomed{transform:scale(1.5);min-width:150vw}
.placeholder{text-align:center;padding:3rem 1rem;color:var(--muted)}
.placeholder .icon{font-size:3rem;margin-bottom:.5rem}
#navbar{display:none;justify-content:center;gap:.5rem;padding:.5rem;position:sticky;top:0;background:var(--bg);z-index:10}
#navbar.active{display:flex}
#navbar button{background:var(--accent);color:#fff;border:none;padding:.4rem .8rem;border-radius:6px;font-size:.75rem;cursor:pointer}
.footer{text-align:center;padding:1.5rem;color:var(--muted);font-size:.65rem}
</style>

var curIdx=-1, scrollPos=0, scrollTimer=null, KEY='huofeng_bm';

// ── Init ──
(function(){
  CHAPTERS.forEach(function(c,i){
    c.scraped=!!SCRAPED[''+c.id];
    c.index=i;
  });
  var cnt=CHAPTERS.filter(function(c){return c.scraped}).length;
  document.getElementById('scrapedCount').textContent='🟢 '+cnt+'/'+CHAPTERS.length;
  document.getElementById('chapCount').textContent=cnt+' 章已掃描';
  buildTOC();
  loadBM();
})();

// ── TOC ──
function buildTOC(){
  var toc=document.getElementById('toc');
  toc.innerHTML='';
  CHAPTERS.forEach(function(c){
    var d=document.createElement('div');
    d.className='toc-item';
    d.innerHTML='<span class="badge '+(c.scraped?'scraped':'pending')+'">'+(c.scraped?'🟢':'⚪')+'</span><span class="label">'+c.num+'</span>';
    d.onclick=function(){loadChapter(c.index)};
    toc.appendChild(d);
  });
}

function showTOC(){
  document.getElementById('toc').style.display='block';
  document.getElementById('viewer').classList.remove('active');
  document.getElementById('navbar').classList.remove('active');
  document.getElementById('ph').style.display='block';
}

// ── Chapter loading ──
function loadChapter(idx){
  var c=CHAPTERS[idx];
  curIdx=idx;
  document.getElementById('toc').style.display='none';
  document.getElementById('ph').style.display='none';

  var v=document.getElementById('viewer');
  v.innerHTML='';
  v.classList.add('active');

  if(!c.scraped){
    v.innerHTML='<div class="placeholder"><div class="icon">⚪</div><p>呢回未掃描</p><a href="https://www.twmanga.com/comic/chapter/huofengliaoyuan-chenmou/0_'+c.id+'.html" target="_blank" style="color:#e67e22">👉 去包子漫畫睇</a></div>';
    saveBM();
    return;
  }

  var sc=SCRAPED[''+c.id];
  var pages=sc.pages||50;
  var imgs=[];
  var base=sc.base;
  
  for(var p=1;p<=pages;p++){
    if(sc.token){
      var fn=sc.pattern.replace(/\{:(\d+)d\}/,function(_,d){return String(p).padStart(parseInt(d),'0');});
      imgs.push('https://comic-proxy.kitlam729.workers.dev/?url='+encodeURIComponent(sc.base+fn+'?'+sc.token));
    } else {
      imgs.push(base+p+'.jpg');
    }
  }

  // Render images with lazy loading
  var loaded=0;
  for(var i=0;i<imgs.length;i++){
    var img=document.createElement('img');
    img.src=imgs[i];
    img.loading='lazy';
    img.onload=function(){
      loaded++;
      if(loaded===Math.min(5,pages) && scrollPos>0){
        setTimeout(function(){v.scrollTop=scrollPos;scrollPos=0;},100);
      }
    };
    v.appendChild(img);
  }

  // Navbar
  var nb=document.getElementById('navbar');
  nb.innerHTML='<button onclick="loadChapter('+(idx-1)+')" '+(idx<=0?'disabled':'')+'>◀ 上回</button>'+
    '<span style="font-size:.75rem;padding:.4rem">'+c.num+' · '+pages+'頁</span>'+
    '<button onclick="loadChapter('+(idx+1)+')" '+(idx>=CHAPTERS.length-1?'disabled':'')+'>下回 ▶</button>';
  nb.classList.add('active');

  saveBM();
}

// ── Bookmarks ──
function saveBM(){
  var v=document.getElementById('viewer');
  var data=JSON.stringify({i:curIdx,s:v.scrollTop,t:Date.now()});
  try{localStorage.setItem(KEY,data)}catch(e){}
  document.cookie=KEY+'='+encodeURIComponent(data)+';expires='+new Date(Date.now()+365*86400000).toUTCString()+';path=/;SameSite=Lax';
}

function loadBM(){
  var raw;
  try{raw=localStorage.getItem(KEY)}catch(e){}
  if(!raw) raw=(document.cookie.match('(^|;)\\s*'+KEY+'\\s*=\\s*([^;]+)')||[])[2];
  if(raw){
    try{var d=JSON.parse(decodeURIComponent(raw));curIdx=d.i;scrollPos=d.s||0}catch(e){}
  }
}

function scrollToBookmark(){
  if(curIdx>=0){loadChapter(curIdx);return}
  showTOC();
}

// Scroll save
document.addEventListener('scroll',function(){
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(function(){
    var v=document.getElementById('viewer');
    if(v.classList.contains('active')){scrollPos=v.scrollTop;saveBM();}
  },1000);
},{passive:true});

// Double-tap zoom
var lastTap=0,lastTarget=null;
document.addEventListener('click',function(e){
  var img=e.target.closest('img');
  if(!img)return;
  var now=Date.now();
  if(now-lastTap<350&&img===lastTarget){
    e.preventDefault();
    img.classList.toggle('zoomed');
    if(img.classList.contains('zoomed')){
      var r=img.getBoundingClientRect();
      img.style.transformOrigin=((e.clientX-r.left)/r.width*100)+'% '+((e.clientY-r.top)/r.height*100)+'%';
    }
  }
  lastTap=now;lastTarget=img;
},{passive:false});
</script>
