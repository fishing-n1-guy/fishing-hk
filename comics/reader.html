<title>🔥 火武耀揚</title>
<style>
:root{--bg:#0d0d0d;--panel:#111;--text:#ccc;--accent:#c0392b;--gold:#f39c12;--border:#2a2a2a;--green:#27ae60}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#050505;border-bottom:1px solid var(--accent);padding:6px 10px;display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:.85em}
.topbar h1{font-size:1.1em;color:var(--accent)}
.topbar .spacer{flex:1}
.topbar button{background:var(--accent);color:#fff;border:none;padding:5px 10px;border-radius:3px;cursor:pointer;font-size:.8em}
.topbar .sec{background:#333}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:250px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-head{padding:8px 10px;border-bottom:1px solid var(--border);font-size:.75em;color:#888;display:flex;justify-content:space-between}
.chlist{flex:1;overflow-y:auto}
.chitem{display:flex;align-items:center;padding:5px 10px;font-size:.7em;color:#aaa;cursor:pointer;border-left:3px solid transparent;gap:6px}
.chitem:active{background:#1a1a1a}
.chitem.active{background:#2a1111;border-left-color:var(--accent);color:var(--accent)}
.chitem .n{color:#666;min-width:28px}
.chitem .badge{font-size:.65em;padding:1px 5px;border-radius:2px;margin-left:auto}
.chitem .badge.ok{background:#1a3a1a;color:var(--green)}
.chitem .badge.pending{background:#1a1a1a;color:#666}
.viewer{flex:1;overflow-y:auto;overflow-x:auto;background:#000;display:flex;flex-direction:column;align-items:center;-webkit-overflow-scrolling:touch}
.viewer img{display:block;width:100%;max-width:100vw;height:auto;touch-action:manipulation;-webkit-user-select:none;min-width:100vw}
.viewer img.zoomed{transform:scale(1.5);z-index:10;position:relative;box-shadow:0 0 30px rgba(0,0,0,.8);min-width:150vw}
.placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:#444;flex-direction:column;gap:8px;text-align:center;padding:20px}
.placeholder .icon{font-size:3em}
.placeholder a{color:var(--accent)}
.navbar{background:#0a0a0a;border-top:1px solid var(--border);padding:6px;display:none;align-items:center;justify-content:center;gap:6px;flex-shrink:0;font-size:.75em}
.navbar button{background:#222;color:#aaa;border:1px solid #333;padding:4px 8px;border-radius:3px;cursor:pointer}
.navbar button:active{color:#fff;background:#333}
.navbar .info{color:var(--gold);min-width:50px;text-align:center}
.mbtn{display:none;background:none;border:none;color:#fff;font-size:1.2em;cursor:pointer;padding:4px}
@media(max-width:768px){
  .sidebar{position:fixed;left:-250px;top:38px;bottom:32px;z-index:20;transition:left .2s}
  .sidebar.open{left:0}
  .mbtn{display:block}
}
.toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 16px;border-radius:20px;font-size:.75em;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

var PROXY = 'https://comic-proxy.kitlam729.workers.dev/?url=';
var BK = 'hwyy_v4';
var curIdx = -1, curPages = [], scrollPos = 0;

// --- Merge ---
for(var k in SCRAPED){
  for(var i=0;i<CHAPTERS.length;i++){
    if(CHAPTERS[i].num===k){
      CHAPTERS[i].scraped=true;
      CHAPTERS[i].pages=SCRAPED[k].pages;
      CHAPTERS[i].base=SCRAPED[k].base;
      CHAPTERS[i].pattern=SCRAPED[k].pattern;
      CHAPTERS[i].token=SCRAPED[k].token;
    }
  }
}

// --- Storage (localStorage + cookie fallback) ---
function loadBM(){
  try{
    var raw=localStorage.getItem(BK);
    if(!raw) raw=getCookie(BK);
    if(raw){var d=JSON.parse(raw);curIdx=d.i;scrollPos=d.s||0;}
  }catch(e){}
}
function saveBM(){
  var v=document.getElementById('viewer');
  var data=JSON.stringify({i:curIdx,s:v.scrollTop,t:Date.now()});
  try{localStorage.setItem(BK,data);setCookie(BK,data,365);}catch(e){}
}
function setCookie(n,v,d){var e=new Date();e.setTime(e.getTime()+d*86400000);document.cookie=n+'='+encodeURIComponent(v)+';expires='+e.toUTCString()+';path=/;SameSite=Lax'}
function getCookie(n){var m=document.cookie.match('(^|;)\\s*'+n+'\\s*=\\s*([^;]+)');return m?decodeURIComponent(m[2]):null}

// --- Toast ---
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},1500);
}

// --- Init ---
function init(){
  document.getElementById('scrapedCount').textContent=CHAPTERS.filter(function(c){return c.scraped}).length;
  document.getElementById('menuBtn').onclick=function(){document.getElementById('sidebar').classList.toggle('open')};
  loadBM();
  renderList();
  if(curIdx>=0) openChapter(curIdx, scrollPos);

  // Double-tap zoom (uses touchend for iOS, click for desktop)
  var lastTap=0, lastTapTarget=null;
  function handleTap(e){
    var img=e.target.closest('img');
    if(!img)return;
    var now=Date.now();
    if(now-lastTap<350 && img===lastTapTarget){
      e.preventDefault();
      img.classList.toggle('zoomed');
      var v=document.getElementById('viewer');
      if(img.classList.contains('zoomed')){
        var rect=img.getBoundingClientRect();
        var cx=(e.clientX||(e.touches&&e.touches[0]&&e.touches[0].clientX)||rect.width/2)-rect.left;
        var cy=(e.clientY||(e.touches&&e.touches[0]&&e.touches[0].clientY)||rect.height/2)-rect.top;
        img.style.transformOrigin=(cx/rect.width*100)+'% '+(cy/rect.height*100)+'%';
        // Center horizontally so both sides scrollable
        setTimeout(function(){
          v.scrollLeft=(v.scrollWidth-v.clientWidth)/2;
        },50);
        toast('🔍 已放大 — 左右拉睇全圖');
      }else{
        toast('縮細');
      }
      lastTap=0;lastTapTarget=null;
    }else{
      lastTap=now;lastTapTarget=img;
    }
  }
  document.getElementById('viewer').addEventListener('click',handleTap,{passive:false});
  document.getElementById('viewer').addEventListener('touchend',handleTap,{passive:false});
}

// --- Render ---
function renderList(){
  var h='';
  for(var i=0;i<CHAPTERS.length;i++){
    var c=CHAPTERS[i],cls='chitem'+(i===curIdx?' active':'');
    var b=c.scraped?'<span class="badge ok">🟢</span>':'<span class="badge pending">⚪</span>';
    h+='<div class="'+cls+'" onclick="openChapter('+i+')"><span class="n">#'+c.num+'</span>'+c.label+b+'</div>';
  }
  document.getElementById('chlist').innerHTML=h;
  if(curIdx>=0) setTimeout(function(){
    var items=document.querySelectorAll('.chitem');
    if(items[curIdx])items[curIdx].scrollIntoView({block:'center',behavior:'smooth'});
  },200);
}

// --- Open chapter ---
function openChapter(idx, savedScroll){
  curIdx=idx;
  if(typeof savedScroll==='number') scrollPos=savedScroll;
  else scrollPos=0;
  curPages=[];
  var c=CHAPTERS[idx];
  document.getElementById('sidebar').classList.remove('open');
  renderList();saveBM();

  var v=document.getElementById('viewer');
  v.querySelectorAll('img').forEach(function(i){i.remove()});
  document.getElementById('placeholder').style.display='none';
  document.getElementById('navbar').style.display='none';
  v.scrollTop=0;

  if(!c.scraped){
    document.getElementById('placeholder').style.display='flex';
    document.getElementById('placeholder').innerHTML='<div class="icon">⚪</div><p>呢回未掃描</p><a href="https://www.manhuagui.com/comic/18415/'+c.id+'.html" target="_blank" style="color:#e74c3c">👉 去漫畫人睇</a>';
    saveBM();toast('📌 書籤已記錄：第'+c.num+'回');
    return;
  }

  var maxPages=c.pages||30;
  for(var p=1;p<=maxPages;p++){
    var fn=c.pattern.replace(/\{:(\d+)d\}/,function(_,d){
      return String(p).padStart(parseInt(d),'0');
    });
    curPages.push(PROXY+encodeURIComponent(c.base+fn+'?'+c.token));
  }

  document.getElementById('navbar').style.display='flex';
  renderPages();
  toast('📖 第'+c.num+'回 · '+maxPages+'頁'+(scrollPos>0?' · 恢復位置':''));
}

// --- Render pages ---
function renderPages(){
  var v=document.getElementById('viewer');
  for(var i=0;i<curPages.length;i++){
    var img=document.createElement('img');
    img.src=curPages[i];
    img.alt='p'+(i+1);
    img.loading=i<3?'eager':'lazy';
    img.onerror=function(){this.style.opacity='0.3';this.alt='❌'};
    img.onload=(function(idx){
      return function(){
        var loaded=document.querySelectorAll('#viewer img[src]').length;
        if(loaded>=Math.min(5,curPages.length) && scrollPos>0){
          v.scrollTop=scrollPos;
          scrollPos=0; // only restore once
        }
      };
    })(i);
    v.appendChild(img);
  }
}

function updateNav(){
  var v=document.getElementById('viewer');
  var vh=v.clientHeight||window.innerHeight;
  var approx=Math.floor(v.scrollTop/vh)+1;
  document.getElementById('pageInfo').textContent='~'+approx+'/'+curPages.length;
}

function nextPage(){
  var v=document.getElementById('viewer');
  v.scrollBy({top:v.clientHeight||window.innerHeight,behavior:'smooth'});
  setTimeout(function(){updateNav();saveBM();},400);
}
function prevPage(){
  var v=document.getElementById('viewer');
  v.scrollBy({top:-(v.clientHeight||window.innerHeight),behavior:'smooth'});
  setTimeout(function(){updateNav();saveBM();},400);
}
function nextChapter(){if(curIdx<CHAPTERS.length-1)openChapter(curIdx+1)}
function prevChapter(){if(curIdx>0)openChapter(curIdx-1)}
function jumpBookmark(){
  if(curIdx>=0)openChapter(curIdx,scrollPos);
  else openChapter(0);
}

// Save bookmark on scroll (debounced)
var scrollSaveTimer;
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('viewer').addEventListener('scroll',function(){
    clearTimeout(scrollSaveTimer);
    scrollSaveTimer=setTimeout(saveBM,1000);
  });
});

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')nextPage();
  if(e.key==='ArrowLeft')prevPage();
});

init();
</script>
