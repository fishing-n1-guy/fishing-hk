<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>🔥 火武耀揚</title>
<style>
:root{--bg:#0d0d0d;--panel:#111;--text:#ccc;--accent:#c0392b;--gold:#f39c12;--border:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#050505;border-bottom:1px solid var(--accent);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:10}
.topbar h1{font-size:1.1em;color:var(--accent);white-space:nowrap}
.topbar .spacer{flex:1}
.topbar button{background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:3px;cursor:pointer;font-size:.8em;white-space:nowrap}
.topbar button:hover{opacity:.8}
.topbar button.sec{background:#333}

.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:5}
.sidebar-head{padding:8px 12px;border-bottom:1px solid var(--border);font-size:.8em;color:#888;display:flex;justify-content:space-between}
.sidebar-head .c{color:var(--gold)}
.chlist{flex:1;overflow-y:auto}
.chlist::-webkit-scrollbar{width:4px}
.chlist::-webkit-scrollbar-thumb{background:#444;border-radius:2px}
.chitem{display:block;padding:6px 12px;font-size:.75em;color:#aaa;text-decoration:none;cursor:pointer;border-left:3px solid transparent;transition:.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chitem:hover{background:#1a1a1a;color:#fff}
.chitem.active{background:#2a1111;border-left-color:var(--accent);color:var(--accent);font-weight:bold}
.chitem .n{color:#666;font-size:.85em;margin-right:5px}

.viewer{flex:1;overflow-y:auto;overflow-x:hidden;background:#000;display:flex;flex-direction:column;align-items:center;-webkit-overflow-scrolling:touch}
.viewer img{display:block;width:100%;max-width:100vw;height:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.viewer .pagewrap{width:100%;max-width:920px;position:relative;line-height:0}
.pagewrap:active img{/* prevent click-through */}

/* Loading */
.loading{flex:1;display:flex;align-items:center;justify-content:center;color:#555;flex-direction:column;gap:8px}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:#444;flex-direction:column;gap:10px}
.placeholder .icon{font-size:3em}

.navbar{background:#0a0a0a;border-top:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:8px;justify-content:center;flex-shrink:0;font-size:.8em}
.navbar button{background:#222;color:#aaa;border:1px solid #333;padding:5px 10px;border-radius:3px;cursor:pointer;font-size:.85em}
.navbar button:hover{color:#fff;border-color:#555}
.navbar .pgnum{color:var(--gold);min-width:60px;text-align:center}
.navbar select{background:#222;color:#fff;border:1px solid #333;padding:4px 8px;border-radius:3px;font-size:.8em}

.mbtn{display:none;background:none;border:none;color:#fff;font-size:1.3em;cursor:pointer;padding:0 4px}
@media(max-width:768px){
  .sidebar{position:fixed;left:-260px;top:42px;bottom:36px;transition:left .25s}
  .sidebar.open{left:0}
  .mbtn{display:block}
  .topbar h1{font-size:.95em}
  .viewer img{max-width:100%}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="mbtn" id="menuBtn">☰</button>
  <h1>🔥 火武耀揚</h1>
  <span class="spacer"></span>
  <button id="continueBtn" class="sec" onclick="continueReading()">▶ 繼續</button>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-head"><span>📖 目錄</span><span class="c" id="chCount"></span></div>
    <div class="chlist" id="chlist"></div>
  </div>
  <div class="viewer" id="viewer">
    <div class="placeholder" id="placeholder">
      <div class="icon">🔥</div>
      <p>👈 揀一回開始睇</p>
    </div>
    <div class="loading" id="loading" style="display:none">
      <div class="spinner"></div>
      <p>載入中...</p>
    </div>
  </div>
</div>

<div class="navbar" id="navbar" style="display:none">
  <button onclick="prevPage()">◀ 上頁</button>
  <span class="pgnum" id="pgnum">1 / 1</span>
  <button onclick="nextPage()">下頁 ▶</button>
  <select id="pageSelect" onchange="goPage(this.value)"></select>
  <button onclick="prevChapter()">⬅ 上回</button>
  <button onclick="nextChapter()">下回 ➡</button>
</div>

  document.getElementById('chCount').textContent = CHAPTERS.length + ' 回';
  loadBookmark();
  renderChapters();
  document.getElementById('menuBtn').onclick = function(){
    document.getElementById('sidebar').classList.toggle('open');
  };
  document.getElementById('viewer').onclick = function(){
    document.getElementById('sidebar').classList.remove('open');
  };
}

function loadBookmark(){
  try{
    var d = JSON.parse(localStorage.getItem(BOOKMARK_KEY));
    if(d && d.idx >= 0 && d.idx < CHAPTERS.length) curIdx = d.idx;
  }catch(e){}
}

function saveBookmark(){
  try{
    localStorage.setItem(BOOKMARK_KEY, JSON.stringify({idx:curIdx, num:curChNum, ts:Date.now()}));
  }catch(e){}
}

// ===== CHAPTER LIST =====
function renderChapters(){
  var list = document.getElementById('chlist');
  var h = '';
  for(var i = 0; i < CHAPTERS.length; i++){
    var c = CHAPTERS[i];
    var cls = 'chitem';
    if(i === curIdx) cls += ' active';
    h += '<div class="'+cls+'" onclick="openChapter('+i+')"><span class="n">#'+c.num+'</span>'+c.label+'</div>';
  }
  list.innerHTML = h;
  if(curIdx >= 0){
    setTimeout(function(){
      var items = list.querySelectorAll('.chitem');
      if(items[curIdx]) items[curIdx].scrollIntoView({block:'center',behavior:'smooth'});
    },200);
  }
}

// ===== OPEN CHAPTER =====
async function openChapter(idx){
  if(idx < 0 || idx >= CHAPTERS.length) return;
  curIdx = idx;
  curPage = 0;
  curPages = [];
  var ch = CHAPTERS[idx];
  curChNum = ch.num;
  
  document.getElementById('sidebar').classList.remove('open');
  renderChapters();
  showLoading();
  saveBookmark();

  var pageUrl = 'https://www.manhuagui.com/comic/18415/' + ch.id + '.html';
  
  try {
    var html = await fetch(PROXY + '?page=' + encodeURIComponent(pageUrl)).then(r => r.text());
    
    // Extract image URLs from HTML
    var imgRegex = /https?:\/\/[a-z]+\.hamreus\.com\/[^"'\s]+\.(?:jpg|webp|png)(?:\?[^"'\s]*)?/gi;
    var matches = html.match(imgRegex) || [];
    
    // Deduplicate
    var seen = {};
    curPages = [];
    for(var i = 0; i < matches.length; i++){
      var u = matches[i];
      if(!seen[u]){
        seen[u] = true;
        curPages.push(u);
      }
    }
    
    if(curPages.length === 0){
      // Fallback: try to find images by other means
      // Some chapters have images in JS variables
      var jsMatch = html.match(/["']([^"']*hamreus\.com[^"']*\.(?:jpg|webp|png)[^"']*)["']/gi);
      if(jsMatch){
        for(var j = 0; j < jsMatch.length; j++){
          var u2 = jsMatch[j].replace(/^["']|["']$/g, '');
          if(!seen[u2]){
            seen[u2] = true;
            curPages.push(u2);
          }
        }
      }
    }
    
    if(curPages.length === 0){
      showError('呢回暫時 load 唔到圖片，可能已被刪除');
      return;
    }
    
    curPage = 0;
    showNavbar();
    renderPages();
    updatePageNav();
    viewer.scrollTop = 0;
    
  } catch(e) {
    showError('Load 失敗: ' + e.message);
  }
}

function showLoading(){
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('navbar').style.display = 'none';
  var viewer = document.getElementById('viewer');
  // Clear old images
  var wraps = viewer.querySelectorAll('.pagewrap');
  for(var i = wraps.length-1; i >= 0; i--) wraps[i].remove();
}

function showError(msg){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('navbar').style.display = 'none';
  document.getElementById('placeholder').style.display = 'flex';
  document.getElementById('placeholder').innerHTML = '<div class="icon">❌</div><p>'+msg+'</p>';
}

function showNavbar(){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('navbar').style.display = 'flex';
}

// ===== RENDER PAGES =====
function renderPages(){
  var viewer = document.getElementById('viewer');
  // Remove old images
  var old = viewer.querySelectorAll('.pagewrap');
  for(var i = old.length-1; i >= 0; i--) old[i].remove();
  
  for(var i = 0; i < curPages.length; i++){
    var wrap = document.createElement('div');
    wrap.className = 'pagewrap';
    
    var img = document.createElement('img');
    // Proxy the image through our worker
    img.src = PROXY + '/?url=' + encodeURIComponent(curPages[i]);
    img.alt = '第' + curChNum + '回 第' + (i+1) + '頁';
    img.loading = i < 5 ? 'eager' : 'lazy';
    img.style.touchAction = 'pinch-zoom';
    
    // Error handling
    img.onerror = function(){
      this.style.display = 'none';
      this.parentElement.innerHTML = '<div style="padding:40px;color:#555;text-align:center">圖片載入失敗</div>';
    };
    
    wrap.appendChild(img);
    viewer.appendChild(wrap);
  }
}

// ===== PAGE NAVIGATION =====
function updatePageNav(){
  document.getElementById('pgnum').textContent = (curPage+1) + ' / ' + curPages.length;
  
  var sel = document.getElementById('pageSelect');
  sel.innerHTML = '';
  for(var i = 0; i < curPages.length; i++){
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = '第' + (i+1) + '頁';
    if(i === curPage) opt.selected = true;
    sel.appendChild(opt);
  }
  
  // Scroll to current page
  var wraps = document.getElementById('viewer').querySelectorAll('.pagewrap');
  if(wraps[curPage]){
    wraps[curPage].scrollIntoView({behavior:'smooth',block:'start'});
  }
}

function nextPage(){
  if(curPage < curPages.length - 1){
    curPage++;
    updatePageNav();
  }
}

function prevPage(){
  if(curPage > 0){
    curPage--;
    updatePageNav();
  }
}

function goPage(n){
  curPage = parseInt(n);
  updatePageNav();
}

function prevChapter(){
  if(curIdx > 0) openChapter(curIdx - 1);
}

function nextChapter(){
  if(curIdx < CHAPTERS.length - 1) openChapter(curIdx + 1);
}

function continueReading(){
  if(curIdx >= 0 && curIdx < CHAPTERS.length){
    openChapter(curIdx);
  } else {
    openChapter(0);
  }
}

// Keyboard nav
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') nextPage();
  if(e.key === 'ArrowLeft') prevPage();
});

init();
</script>
</body>
</html>
